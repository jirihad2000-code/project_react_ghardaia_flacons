<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>SARL Ghardaia Flacons</title>
    <script type="text/javascript">
      // يقوم هذا السكربت بالتقاط المسار الذي طلبته إعادة توجيهه وتحويله إلى index.html ليتولى React Router قراءته
      var segmentCount = 1; // اجعلها 1 لأن موقعك مرفوع على مسار فرعي لـ GitHub، أو 0 إذا كان على الدومين الرئيسي
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + segmentCount).join('/') + '/?p=/' +
        l.pathname.slice(1).split('/').slice(segmentCount).join('/').replace(/&/g, '~and~') +
        (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
  </body>
</html>
